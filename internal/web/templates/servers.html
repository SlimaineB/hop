{{define "servers.html"}}
{{template "head" .}}
<section class="dash-topline">
  <div class="dash-heading">
    <p class="eyebrow">server inventory</p>
    <h1>Servers <span>&amp; VMs</span></h1>
  </div>
  <div class="dash-hero-actions">
    <form class="dash-search" id="server-filter" role="search">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.2-3.2"></path></svg>
      <input id="server-filter-input" type="text" placeholder="Filter by name, env, host, tag…" autocomplete="off" spellcheck="false" aria-label="Filter servers">
      <kbd>/</kbd>
    </form>
    <div class="dash-actions">
      <button id="server-refresh" class="ghost" type="button">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"></path><path d="M21 3v6h-6"></path></svg>
        Refresh
      </button>
      <button id="server-live" class="ghost live-btn on" type="button" aria-pressed="true" title="Refresh every 30 seconds">
        <span class="live-dot" aria-hidden="true"></span>
        Live
      </button>
    </div>
  </div>
</section>

<section class="kpi-grid kpi-grid-4" id="server-kpis" aria-label="Server metrics">
  <article class="kpi"><span class="kpi-label">Servers</span><span class="kpi-value" data-srv="total">—</span><span class="kpi-sub" data-srv="total_sub">loading</span></article>
  <article class="kpi kpi-ok"><span class="kpi-label">Online</span><span class="kpi-value" data-srv="ok">—</span><span class="kpi-sub" data-srv="ok_sub">—</span></article>
  <article class="kpi kpi-warn"><span class="kpi-label">Warnings</span><span class="kpi-value" data-srv="warn">—</span><span class="kpi-sub" data-srv="warn_sub">—</span></article>
  <article class="kpi kpi-warn"><span class="kpi-label">Down</span><span class="kpi-value" data-srv="down">—</span><span class="kpi-sub" data-srv="down_sub">—</span></article>
</section>

<section class="dash-section server-section">
  <div class="dash-section-head">
    <div><span class="section-kicker">inventory</span><h2>All servers</h2></div>
    <div class="server-section-meta">
      <span class="dash-updated" id="server-updated">waiting for checks…</span>
      <span class="section-count" id="server-count">—</span>
    </div>
  </div>
  <section class="dash-panel">
    <div class="server-table" id="servers-grid" role="table" aria-label="Servers">
      <div class="dash-loading">Loading server checks…</div>
    </div>
  </section>
</section>

<section class="dash-errors" id="server-errors" hidden></section>
{{template "foot" .}}
{{end}}
